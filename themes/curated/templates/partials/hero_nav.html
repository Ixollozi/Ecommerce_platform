{# Nav circles on header figure — same set as theme main #}
{% load i18n %}
<nav class="cu-orbits" aria-label="{% trans 'Primary' %}">
  <a class="cu-orbit" href="{% url 'index' %}" {% if request.resolver_match.url_name == 'index' %}aria-current="page"{% endif %} title="{% trans 'Home' %}">
    <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 10.5L12 4l8 6.5V20a1 1 0 0 1-1 1h-5v-6H10v6H5a1 1 0 0 1-1-1v-9.5z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>
  </a>
  <a class="cu-orbit" href="{% url 'catalog' %}" {% if request.resolver_match.url_name == 'catalog' %}aria-current="page"{% endif %} title="{% trans 'Catalog' %}">
    <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 7h14M5 12h14M5 17h14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
  </a>
  <a class="cu-orbit" href="{% url 'about' %}" {% if request.resolver_match.url_name == 'about' %}aria-current="page"{% endif %} title="{% trans 'About' %}">
    <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="8" r="3.2" stroke="currentColor" stroke-width="1.5"/><path d="M5.5 19c1.2-3.2 3.4-4.8 6.5-4.8S16.3 15.8 17.5 19" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
  </a>
  <a class="cu-orbit" href="{% url 'contact' %}" {% if request.resolver_match.url_name == 'contact' %}aria-current="page"{% endif %} title="{% trans 'Contacts' %}">
    <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="4.5" y="6" width="15" height="12" rx="1.5" stroke="currentColor" stroke-width="1.5"/><path d="M5 7.5l7 5.5 7-5.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </a>
  <a class="cu-orbit" href="#" title="{% trans 'Search' %}" aria-label="{% trans 'Search' %}">
    <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="11" cy="11" r="5.5" stroke="currentColor" stroke-width="1.5"/><path d="M15.5 15.5L20 20" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
  </a>
  <a class="cu-orbit cu-orbit--cart" href="{% url 'cart' %}" title="{% trans 'Cart' %}" aria-label="{% trans 'Cart' %}">
    <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M7 9.5h10M8.2 9.5l.8 9.5h6l.8-9.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M9.5 9.5a2.5 2.5 0 0 1 5 0" stroke="currentColor" stroke-width="1.5"/></svg>
    <span class="cu-orbit-count cart-count" style="display:none">0</span>
  </a>
  <div class="cu-orbit cu-orbit--lang language-switcher">
    <button class="language-btn" type="button" aria-expanded="false" aria-haspopup="listbox" aria-label="{% trans 'Language' %}">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="8" stroke="currentColor" stroke-width="1.5"/><path d="M4.5 12h15M12 4.5c2.2 2.4 3.3 4.8 3.3 7.5S14.2 17.1 12 19.5C9.8 17.1 8.7 14.7 8.7 12S9.8 6.9 12 4.5z" stroke="currentColor" stroke-width="1.5"/></svg>
    </button>
    <div class="language-dropdown" role="listbox">
      <form action="{% url 'set_language' %}" method="post">{% csrf_token %}
        <input type="hidden" name="language" value="ru">
        <input type="hidden" name="next" value="{{ request.get_full_path }}">
        <button type="submit" class="lang-option {% if CURRENT_LANGUAGE == 'ru' %}active{% endif %}">Русский</button>
      </form>
      <form action="{% url 'set_language' %}" method="post">{% csrf_token %}
        <input type="hidden" name="language" value="en">
        <input type="hidden" name="next" value="{{ request.get_full_path }}">
        <button type="submit" class="lang-option {% if CURRENT_LANGUAGE == 'en' %}active{% endif %}">English</button>
      </form>
      <form action="{% url 'set_language' %}" method="post">{% csrf_token %}
        <input type="hidden" name="language" value="uz">
        <input type="hidden" name="next" value="{{ request.get_full_path }}">
        <button type="submit" class="lang-option {% if CURRENT_LANGUAGE == 'uz' %}active{% endif %}">O'zbek</button>
      </form>
    </div>
  </div>
</nav>
